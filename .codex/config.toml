# dist/codex shipped config — copy into the project's .codex/config.toml
# (trusted projects) or merge into ~/.codex/config.toml.
#
# Model: session defaults for Codex agent workflows.
model = "openai.gpt-5.5"
model_context_window = 1000000
model_reasoning_effort = "high"

# Default Model Provider:
# Standard OpenAI auth is default (comment out model_provider and provider block).
# If routing through Amazon Bedrock or Azure, uncomment the relevant block below.
# model_provider = "amazon-bedrock"
# [model_providers.amazon-bedrock.aws]
# profile = "default"
# region = "us-east-1"

# The AIDLC method (the markdown rule layers: org/team/project + phases/) now
# lives at the workspace root under aidlc/spaces/<space>/memory/ — the single
# hand-editable source of truth, identical on every harness.
[shell_environment_policy]
set = { AIDLC_RULES_DIR = "aidlc/spaces/default/memory" }

# Sandbox: workspace-write keeps <workspace>/.git read-only BY DESIGN;
# interactive sessions escalate (deny -> approve -> retry unsandboxed).
# HEADLESS runs (codex exec workers, CI, test drivers) cannot escalate:
# uncomment writable_roots with the MAIN repo's absolute .git path.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Network Access: Restrict to false for offline environments.
# Enable only when tasks require fetching public package dependencies.
network_access = false
# writable_roots = ["/absolute/path/to/main-repo/.git"]

# Delegated roles are leaves. The conductor owns every spawn and agents cannot
# recursively delegate.
[agents]
max_depth = 1

# Gates: Prose gates are the floor; these flags enable the structured
# request_user_input tool for interactive stages.
[tools]
experimental_request_user_input = { enabled = true }

[features]
default_mode_request_user_input = false

# Statusline: Predefined item IDs only.
[tui]
status_line = ["model-with-reasoning", "git-branch", "task-progress", "context-used"]
