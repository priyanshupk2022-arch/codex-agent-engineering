# ==============================================================================
# Codex Agent Engineering (CAE) — Portable Configuration Template
# File: .codex/config.example.toml
#
# Copy this file to .codex/config.toml (or merge with ~/.codex/config.toml)
# to configure your local OpenAI Codex CLI environment.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CORE MODEL CONFIGURATION (Safe Portable Defaults)
# ------------------------------------------------------------------------------
# Standard model identifier and reasoning depth.
model = "openai.gpt-5.5"
model_context_window = 1000000
model_reasoning_effort = "high"

# Default provider: Comment out model_provider to use direct OpenAI authentication.
# To use Amazon Bedrock or Azure OpenAI, configure the provider blocks below.
# model_provider = "amazon-bedrock"

# ------------------------------------------------------------------------------
# 2. SECURITY & SANDBOX BOUNDARIES (CRITICAL)
# ------------------------------------------------------------------------------
# Sandbox Modes:
#   - "read-only": Safe inspection mode; no disk writes allowed.
#   - "workspace-write" (RECOMMENDED DEFAULT): Writes restricted to the active
#     workspace. <workspace>/.git remains read-only to prevent repo corruption.
#   - "danger-full-access": Unrestricted host access (USE ONLY in throwaway containers).
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Network Access:
# Set to false for strict offline execution. When set to true, outbound traffic
# should ideally be restricted via firewall/proxy to trusted package registries
# (pypi.org, registry.npmjs.org, github.com).
network_access = false

# Headless & CI Writable Roots:
# In interactive sessions, git operations prompt for user elevation. In headless
# or CI execution (codex exec), interactive approval is impossible.
# To allow headless git commits, specify the main repository's absolute .git path:
# writable_roots = ["/path/to/main-repo/.git"]

# Approval Policies:
#   - "on-request": Interactive prompts for destructive actions (default for humans).
#   - "never": Strictly deny any command requiring escalation (default for automated pipelines).
#   - "always": Unconditionally prompt on every command.
approval_policy = "on-request"

# ------------------------------------------------------------------------------
# 3. SHELL & METHOD POLICY
# ------------------------------------------------------------------------------
# Points to project-specific lifecycle rules and shared memory.
[shell_environment_policy]
set = { AIDLC_RULES_DIR = "aidlc/spaces/default/memory" }

# Maximum agent sub-delegation depth (1 = Conductor only delegates to direct leaf agents).
[agents]
max_depth = 1

# ------------------------------------------------------------------------------
# 4. DEVELOPER-SPECIFIC CLOUD PROVIDER CONFIGURATION (UNTRACKED OVERRIDES)
# ------------------------------------------------------------------------------
# DO NOT commit AWS credentials, IAM keys, or private endpoints.
# Configure your local AWS profile via AWS CLI ('aws configure') and reference it here.
#
# [model_providers.amazon-bedrock.aws]
# profile = "default"
# region = "us-east-1"

# ------------------------------------------------------------------------------
# 5. EXPERIMENTAL FEATURES & TOOLS
# ------------------------------------------------------------------------------
# Structured user-input tool for interactive clarification stages.
[tools]
experimental_request_user_input = { enabled = true }

[features]
default_mode_request_user_input = false

# Terminal UI status indicators
[tui]
status_line = ["model-with-reasoning", "git-branch", "task-progress", "context-used"]
