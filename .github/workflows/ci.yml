name: CAE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Verification Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio

      - name: Run Core Test Suite
        run: |
          pytest tests/ -v

      - name: Run Examples Test Suite
        run: |
          pytest examples/ -v

      - name: Run Benchmark Suite (Deterministic Reference)
        run: |
          python benchmarks/runners/runner.py reference

      - name: Run Benchmark Suite (Buggy Baseline Defect Detection)
        run: |
          python benchmarks/runners/runner.py buggy

      - name: Validate Skills Contract Compliance
        run: |
          python scripts/validate_skills.py

      - name: Verify Skills Projection Synchronization
        run: |
          python scripts/check_skill_sync.py

      - name: Verify Internal Markdown Link Integrity
        run: |
          python scripts/check_links.py

      - name: Run Automated OSS Release Audit Gate
        run: |
          python scripts/oss_release_audit.py
